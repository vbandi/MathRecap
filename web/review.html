<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MathRecap - illusztrációk átnézése</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { background: var(--grid), var(--bg); background-attachment: fixed; font-size: 15px; }
  .topbar { position: sticky; top: 0; z-index: 2; }
  .spacer { flex: 1; }
  main { max-width: 980px; margin: 32px auto 60px; padding: 0 20px; }
  h1 { margin: 6px 0 10px; font: 800 30px/1.15 var(--font-display); }
  a { color: var(--accent); }
  .panel { margin: 0 0 20px; padding: 20px 24px; background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; }
  .panel h2 { margin: 0 0 10px; font: 700 18px/1.2 var(--font-display); }
  .panel li { margin: 6px 0; color: var(--fg-soft); }
  .toolbar { position: sticky; top: 52px; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 0 0 16px; padding: 12px 16px;
    background: rgba(21, 26, 44, .95); border: 1px solid var(--line); border-radius: var(--radius); }
  .toolbar label { display: inline-flex; align-items: center; gap: 8px; color: var(--fg-soft); }
  .toolbar select { padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--input); color: var(--fg); }
  #review-summary { color: var(--dim); font-size: 13px; }
  .branch > h2 { margin: 26px 0 10px; font: 700 20px/1.2 var(--font-display); }
  .skill { margin: 0 0 10px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line-strong); border-radius: var(--radius-sm); }
  .skill.status-ok { border-left-color: var(--accent); }
  .skill.status-fix { border-left-color: var(--warn); }
  .skill-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }
  .skill-header a { font-weight: 700; text-decoration: none; }
  .skill-header a:hover { text-decoration: underline; }
  .segmented { display: inline-flex; gap: 2px; padding: 3px; background: var(--input); border: 1px solid var(--line); border-radius: 999px; }
  .segmented button { padding: 4px 11px; border: 0; border-radius: 999px; background: transparent; color: var(--dim); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .flags { margin: 10px 0 0; padding: 0; list-style: none; }
  .flags li { display: flex; gap: 8px; align-items: baseline; margin: 5px 0; color: var(--fg-soft); font-size: 14px; }
  .tag { flex: 0 0 auto; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .03em; }
  .tag-wording { background: rgba(108, 92, 231, .22); color: #b9b0ff; }
  .tag-math { background: rgba(217, 79, 69, .2); color: #ff9d95; }
  .tag-check { background: rgba(232, 163, 61, .2); color: #ffc978; }
  .tag-ux { background: rgba(11, 132, 214, .22); color: #8ccdf7; }
  .note { display: block; width: 100%; margin-top: 10px; padding: 7px 10px; resize: vertical; border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--input); color: var(--fg); font: 14px/1.5 var(--font); }
  .note:focus { outline: none; border-color: var(--accent); }
  .save-state { min-height: 1.4em; margin: 6px 0 0; color: var(--dim); font-size: 12px; }
  .save-state[data-kind="error"] { color: var(--warn); }
  .text-button { padding: 0; border: 0; background: none; color: var(--accent); font-size: 12px; font-weight: 600; cursor: pointer; }
  .text-button:hover { text-decoration: underline; text-underline-offset: 3px; }
  .load-error { color: var(--warn); }
  @media (max-width: 600px) { main { padding: 0 12px; } .panel { padding: 16px; } .toolbar { top: 52px; } }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo" aria-hidden="true">√</span>MathRecap <small>illusztrációk átnézése</small></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="index.html" aria-label="Vissza a készségfához">← <span class="wide-only">Vissza a fához</span></a>
    <div class="account" id="account"></div>
  </header>
  <main>
    <p class="eyebrow">Átnézés</p>
    <h1>Illusztrációk átnézése</h1>
    <section class="panel">
      <h2>Nyitott kérdések</h2>
      <ul id="review-questions"></ul>
      <h2>Mindegyikre vonatkozik</h2>
      <ul id="review-general"></ul>
    </section>
    <div class="toolbar">
      <label><input id="filter-flagged" type="checkbox"> Csak a jelzettek</label>
      <label>Állapot:
        <select id="filter-status">
          <option value="all">mind</option>
          <option value="todo">átnézendő</option>
          <option value="fix">javítandó</option>
          <option value="ok">rendben</option>
        </select>
      </label>
      <button id="export-copy" class="btn ghost" type="button">Jegyzetek másolása</button>
      <button id="export-download" class="btn ghost" type="button">Letöltés (.md)</button>
      <span id="review-summary"></span>
    </div>
    <div id="review-list"></div>
  </main>
  <script type="module" src="review.js"></script>
</body>
</html>
