<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MathRecap - illusztrációk átnézése</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="review.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo" aria-hidden="true">√</span>MathRecap <small>illusztrációk átnézése</small></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="index.html" aria-label="Vissza a készségfához">← <span class="wide-only">Vissza a fához</span></a>
    <div class="account" id="account"></div>
  </header>
  <main>
    <p class="eyebrow">Átnézés</p>
    <h1>Illusztrációk átnézése</h1>
    <section class="panel">
      <h2>Nyitott kérdések</h2>
      <ul id="review-questions"></ul>
      <h2>Mindegyikre vonatkozik</h2>
      <ul id="review-general"></ul>
    </section>
    <div class="toolbar">
      <label><input id="filter-flagged" type="checkbox"> Csak a jelzettek</label>
      <label>Állapot:
        <select id="filter-status">
          <option value="all">mind</option>
          <option value="todo">átnézendő</option>
          <option value="fix">javítandó</option>
          <option value="ok">rendben</option>
        </select>
      </label>
      <button id="export-copy" class="btn ghost" type="button">Jegyzetek másolása</button>
      <button id="export-download" class="btn ghost" type="button">Letöltés (.md)</button>
      <span id="review-summary"></span>
    </div>
    <div id="review-list"></div>
  </main>
  <script type="module" src="review.js"></script>
</body>
</html>
